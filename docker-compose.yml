version: '3.8'

services:

    mysql:
        image: mysql:8
        environment:
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    zookeeper:
        image: confluentinc/cp-zookeeper:7.6.1
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - "2181:2181"
        healthcheck:
            test: ["CMD-SHELL", "echo ruok | nc -w 5 127.0.0.1 2181 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    kafka:
        image: confluentinc/cp-kafka:7.6.1
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        healthcheck:
            test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    user-service:
        build:
            context: .
            dockerfile: user-service/Dockerfile
        ports:
            - "8085:8085"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/payverse_user_db
            DB_USERNAME: root
            DB_PASSWORD: root
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    wallet-service:
        build:
            context: .
            dockerfile: wallet-service/Dockerfile
        ports:
            - "8081:8081"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/payverse_wallet_db
            DB_USERNAME: root
            DB_PASSWORD: root
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    payment-service:
        build:
            context: .
            dockerfile: payment-service/Dockerfile
        ports:
            - "8082:8082"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/payverse_payment_db
            DB_USERNAME: root
            DB_PASSWORD: root
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            REDIS_HOST: redis
            REDIS_PORT: 6379
            WALLET_SERVICE_URL: http://wallet-service:8081
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    notification-service:
        build:
            context: .
            dockerfile: notification-service/Dockerfile
        ports:
            - "8083:8083"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/payverse_notification_db
            DB_USERNAME: root
            DB_PASSWORD: root
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    ledger-service:
        build:
            context: .
            dockerfile: ledger-service/Dockerfile
        ports:
            - "8084:8084"
        environment:
            DB_URL: jdbc:mysql://mysql:3306/payverse_ledger_db
            DB_USERNAME: root
            DB_PASSWORD: root
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        depends_on:
            mysql:
                condition: service_healthy
            kafka:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    api-gateway:
        build:
            context: .
            dockerfile: api-gateway/Dockerfile
        ports:
            - "8080:8080"
        environment:
            REDIS_HOST: redis
            REDIS_PORT: 6379
            JWT_SECRET: ${JWT_SECRET}
            USER_SERVICE_URL: http://user-service:8085
            WALLET_SERVICE_URL: http://wallet-service:8081
            PAYMENT_SERVICE_URL: http://payment-service:8082
            NOTIFICATION_SERVICE_URL: http://notification-service:8083
            LEDGER_SERVICE_URL: http://ledger-service:8084
        depends_on:
            user-service:
                condition: service_healthy
            wallet-service:
                condition: service_healthy
            payment-service:
                condition: service_healthy
            notification-service:
                condition: service_healthy
            ledger-service:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

volumes:
    mysql-data:
